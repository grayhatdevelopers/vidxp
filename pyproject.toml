[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vidxp"
version = "0.1.0-b.1"
authors = [
  { name = "Muhammad Haroon" },
  { name = "Talha Momin" },
  { name = "Talha Amjad" },
  { name = "Abdurrehman Subhani" },
  { name = "Saad Bazaz" },

]
description = "VidXP - Video indexing and search by dialogue, scene, and actor"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["video", "search", "indexing", "cli", "streamlit"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "chromadb",
  "face_recognition",
  "moviepy==1.0.3",
  "numpy>=2.1,<3",
  "opencv-python",
  "Pillow>=7.0.0",
  "rich",
  "sentence-transformers>=3.4,<4",
  "setuptools>=68,<81",
  "openai-clip>=1.0.1",
  "torch",
  "typer",
  "whisperx>=3.8.6,<3.9",
]

[project.optional-dependencies]
frontend = [
  "streamlit",
]

[project.scripts]
vidxp = "vidxp.main:main"
vidxp-ui = "vidxp.frontend:run"

[project.urls]
Repository = "https://github.com/grayhatdevelopers/vidxp"
Issues = "https://github.com/grayhatdevelopers/vidxp/issues"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["vidxp"]
include-package-data = true

[tool.setuptools.package-data]
vidxp = []

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
build_command = "bash ./utils/build_package.sh"
commit_parser = "conventional"
major_on_zero = true
allow_zero_version = true

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "docs", "style", "refactor", "perf", "test", "build", "ci", "chore"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
parse_squash_commits = true
ignore_merge_commits = true

[tool.semantic_release.changelog.default_templates]
changelog_file = "./CHANGELOG.md"
output_format = "md"

[tool.semantic_release.branches.release]
match = "release"
prerelease = false

[tool.semantic_release.branches.main]
match = "main"
prerelease = true
prerelease_token = "b"
