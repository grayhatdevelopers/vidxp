[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vidxp"
version = "0.4.0-b.1"
authors = [
  { name = "Muhammad Haroon" },
  { name = "Talha Momin" },
  { name = "Talha Amjad" },
  { name = "Abdurrehman Subhani" },
  { name = "Saad Bazaz" },

]
description = "VidXP - Video indexing and search by dialogue, scene, and actor"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["video", "search", "indexing", "cli", "streamlit"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Video",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dynamic = ["optional-dependencies"]
dependencies = [
  "dbos>=2.28,<3",
  "filelock>=3.32,<4",
  "packaging>=26.2,<27",
  "platformdirs>=4.11,<5",
  "pydantic>=2.13.4,<3",
  "pydantic-settings>=2.14.2,<3",
  "pyjwt>=2.13,<3",
  "rich>=15,<16",
  "sqlalchemy>=2.0.51,<2.1",
  "typer>=0.27,<1",
]

[project.scripts]
vidxp = "vidxp.entrypoint:main"
vidxp-api = "vidxp.api_cli:main"
vidxp-worker = "vidxp.workflow_worker:main"
vidxp-database = "vidxp.database_cli:main"
vidxp-hooks = "vidxp.hook_cli:main"
vidxp-mcp = "vidxp.mcp_cli:main"

[project.urls]
Homepage = "https://github.com/grayhatdevelopers/vidxp"
Repository = "https://github.com/grayhatdevelopers/vidxp"
Issues = "https://github.com/grayhatdevelopers/vidxp/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["vidxp*"]

[tool.setuptools.package-data]
vidxp = [
  "assets/artifact_download/*",
  "assets/upload_page/*",
  "benchmarks/requirements.txt",
  "capabilities/*/requirements.txt",
  "requirements/*.txt",
  "migrations/*.py",
  "migrations/versions/*.py",
]

[tool.setuptools.dynamic.optional-dependencies]
storage = { file = ["src/vidxp/requirements/storage.txt"] }
dialogue = { file = [
  "src/vidxp/requirements/storage.txt",
  "src/vidxp/capabilities/dialogue/requirements.txt",
] }
scene = { file = [
  "src/vidxp/requirements/storage.txt",
  "src/vidxp/capabilities/scene/requirements.txt",
] }
actor = { file = [
  "src/vidxp/requirements/storage.txt",
  "src/vidxp/capabilities/actor/requirements.txt",
] }
all = { file = [
  "src/vidxp/requirements/storage.txt",
  "src/vidxp/capabilities/dialogue/requirements.txt",
  "src/vidxp/capabilities/scene/requirements.txt",
  "src/vidxp/capabilities/actor/requirements.txt",
] }
local-worker = { file = [
  "src/vidxp/requirements/storage.txt",
  "src/vidxp/requirements/slm.txt",
  "src/vidxp/capabilities/dialogue/requirements.txt",
  "src/vidxp/capabilities/scene/requirements.txt",
  "src/vidxp/capabilities/actor/requirements.txt",
] }
mcp = { file = ["src/vidxp/requirements/mcp.txt"] }
slm = { file = ["src/vidxp/requirements/slm.txt"] }
server = { file = [
  "src/vidxp/requirements/server.txt",
  "src/vidxp/requirements/mcp.txt",
] }
server-worker = { file = [
  "src/vidxp/requirements/server.txt",
  "src/vidxp/requirements/server-storage.txt",
  "src/vidxp/requirements/slm.txt",
  "src/vidxp/capabilities/dialogue/requirements.txt",
  "src/vidxp/capabilities/scene/requirements.txt",
  "src/vidxp/capabilities/actor/requirements.txt",
] }
test = { file = ["src/vidxp/requirements/test.txt"] }
frontend = { file = ["src/vidxp/requirements/frontend.txt"] }
benchmarks = { file = ["src/vidxp/benchmarks/requirements.txt"] }

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
