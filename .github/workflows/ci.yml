name: CI

on:
  pull_request:
    branches:
      - main
      - release
    types:
      - opened
      - synchronize
      - reopened
  workflow_call:
    inputs:
      checkout_ref:
        description: Exact commit to validate.
        required: false
        type: string
      force_validation:
        description: Run validation without PR path scoping.
        required: false
        default: false
        type: boolean
      python_versions:
        description: JSON array of Python versions to validate.
        required: false
        default: '["3.14"]'
        type: string
      provider_platforms:
        description: JSON array of runner labels for provider validation.
        required: false
        default: '["windows-2025"]'
        type: string
      run_containers:
        description: Run container validation when validation is forced.
        required: false
        default: false
        type: boolean
      package_artifact_name:
        description: Preserve the already-smoke-tested distribution under this name.
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: Exact commit to validate.
        required: true
        type: string
      force_validation:
        description: Run validation without PR path scoping.
        required: false
        default: true
        type: boolean
      python_versions:
        description: JSON array of Python versions to validate.
        required: false
        default: '["3.14"]'
        type: string
      provider_platforms:
        description: JSON array of runner labels for provider validation.
        required: false
        default: '["windows-2025"]'
        type: string
      run_containers:
        description: Run container validation.
        required: false
        default: true
        type: boolean
      package_artifact_name:
        description: Preserve the already-smoke-tested distribution under this name.
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.checkout_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  scope:
    if: >-
      github.event_name != 'pull_request' ||
      github.base_ref != 'release' ||
      github.head_ref != 'main'
    runs-on: ubuntu-latest
    outputs:
      needs_python: ${{ steps.scope.outputs.needs_python }}
      run_container: ${{ steps.scope.outputs.run_container }}
      run_suite: ${{ steps.scope.outputs.run_suite }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Validate GitHub Actions workflows
        run: bash utils/check_workflows.sh

      - name: Determine validation scope
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FORCE_VALIDATION: ${{ inputs.force_validation || false }}
          RUN_CONTAINERS: ${{ inputs.run_containers || false }}
        run: |
          if [[ "$FORCE_VALIDATION" == "true" ]]; then
            {
              echo "run_suite=true"
              echo "run_container=$RUN_CONTAINERS"
              echo "needs_python=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python utils/ci_scope.py \
            --base "$BASE_SHA" \
            --github-output "$GITHUB_OUTPUT"

  validate:
    if: needs.scope.outputs.needs_python == 'true'
    needs: scope
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python_versions || '["3.14"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - uses: actions/setup-node@v7
        if: needs.scope.outputs.run_suite == 'true' && matrix.python-version == '3.14'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/upload-page/package-lock.json

      - name: Install repository tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "uv==0.12.0"
          python -m pip install -r utils/build-requirements.txt

      - name: Verify Python lockfile
        run: uv lock --check

      - name: Install test surface
        if: needs.scope.outputs.run_suite == 'true'
        run: |
          uv sync \
            --frozen \
            --extra all \
            --extra frontend \
            --extra benchmarks \
            --extra server \
            --extra slm \
            --extra test \
            --no-dev

      - name: Lint
        if: needs.scope.outputs.run_suite == 'true' && matrix.python-version == '3.14'
        run: ruff check src tests

      - name: Install locked upload-page tooling
        if: needs.scope.outputs.run_suite == 'true' && matrix.python-version == '3.14'
        run: npm ci
        working-directory: web/upload-page

      - name: Test upload page
        if: needs.scope.outputs.run_suite == 'true' && matrix.python-version == '3.14'
        run: npm test
        working-directory: web/upload-page

      - name: Build upload page and verify committed bundle
        if: needs.scope.outputs.run_suite == 'true' && matrix.python-version == '3.14'
        run: npm run check:bundle
        working-directory: web/upload-page

      - name: Test
        if: needs.scope.outputs.run_suite == 'true'
        run: uv run --no-sync python -m unittest discover -s tests -q
        env:
          PYTHONPATH: src

      - name: Build wheel and source distribution
        if: needs.scope.outputs.run_suite == 'true' && matrix.python-version == '3.14'
        run: bash utils/build_package.sh

      - name: Verify minimal wheel
        if: needs.scope.outputs.run_suite == 'true' && matrix.python-version == '3.14'
        shell: bash
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install --upgrade pip
          .wheel-smoke/bin/python -m pip install dist/*.whl
          .wheel-smoke/bin/python -m pip check
          .wheel-smoke/bin/python utils/verify_runtime.py minimal \
            --vidxp-executable .wheel-smoke/bin/vidxp

      - name: Preserve the validated distribution
        if: >-
          needs.scope.outputs.run_suite == 'true' &&
          matrix.python-version == '3.14' &&
          inputs.package_artifact_name != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.package_artifact_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Validate Compose configuration
        if: needs.scope.outputs.run_container == 'true' && matrix.python-version == '3.14'
        run: bash utils/validate_compose.sh

      - name: Build container
        if: needs.scope.outputs.run_container == 'true' && matrix.python-version == '3.14'
        run: docker build --tag vidxp:ci .

      - name: Smoke container
        if: needs.scope.outputs.run_container == 'true' && matrix.python-version == '3.14'
        run: bash utils/smoke_container.sh vidxp:ci

  provider-platform-smoke:
    if: needs.scope.outputs.run_suite == 'true'
    needs: scope
    name: CPU providers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.provider_platforms || '["windows-2025"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install locked local-worker environment
        run: |
          python -m pip install "uv==0.12.0"
          uv sync --frozen --extra local-worker --no-dev

      - name: Verify model provider contracts without network downloads
        run: uv run --no-sync python -m unittest discover -s tests -p "test_models.py" -q
        env:
          PYTHONPATH: src
          VIDXP_ALLOW_MODEL_DOWNLOADS: "false"

      - name: Verify indexing provider contracts without network downloads
        run: uv run --no-sync python -m unittest discover -s tests -p "test_indexing.py" -q
        env:
          PYTHONPATH: src
          VIDXP_ALLOW_MODEL_DOWNLOADS: "false"

      - name: Verify platform and CPU runtime
        run: uv run --no-sync python utils/verify_runtime.py cpu
