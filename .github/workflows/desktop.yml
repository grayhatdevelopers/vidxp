name: Desktop

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Commit to build
        required: true
        type: string
      artifact_retention_days:
        description: Number of days to retain built installers.
        required: false
        default: 14
        type: number
      sign:
        description: Sign and notarize the macOS build (requires Apple secrets).
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: Commit, branch, or tag to build
        required: false
        default: ""
        type: string
      artifact_retention_days:
        description: Number of days to retain built installers.
        required: false
        default: 14
        type: number
      sign:
        description: Sign and notarize the macOS build (requires Apple secrets).
        required: false
        default: false
        type: boolean
permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.pull_request.number || inputs.checkout_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.target == 'windows' && 'Windows x86-64 NSIS' || matrix.target == 'macos' && 'macOS Apple Silicon DMG' || 'Linux x86-64 AppImage' }}
    runs-on: ${{ matrix.target == 'windows' && 'windows-2025' || matrix.target == 'macos' && 'macos-15' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        target: [windows, macos, linux]

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.event.inputs.checkout_ref || github.sha }}

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.0"
          enable-cache: false

      - id: rust-toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install locked license tooling
        run: cargo install cargo-about --version 0.9.1 --locked --features cli

      - name: Restore Rust build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: desktop-rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            desktop-rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.cachekey }}-

      - name: Install locked desktop tooling
        run: npm ci
        working-directory: desktop

      - name: Check the desktop frontend
        run: npm run check
        working-directory: desktop

      - name: Verify generated desktop contracts and notices
        run: |
          cargo fetch --manifest-path src-tauri/Cargo.toml --locked
          npm run model-catalog:check
          npm run notices:check
        working-directory: desktop

      - name: Restore the pinned uv sidecar
        id: uv-sidecar-cache
        uses: actions/cache@v6
        with:
          path: desktop/src-tauri/binaries
          key: desktop-uv-sidecar-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/sidecars.json') }}

      - name: Fetch the pinned uv sidecar
        if: steps.uv-sidecar-cache.outputs.cache-hit != 'true'
        run: npm run ${{ matrix.target == 'windows' && 'sidecar:windows' || 'sidecar:unix' }}
        working-directory: desktop

      - name: Test the locked desktop crate
        run: cargo test --release --locked --manifest-path desktop/src-tauri/Cargo.toml

      - name: Prepare the Apple notarization key
        id: apple_key
        if: runner.os == 'macOS' && inputs.sign
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [[ -z "$APPLE_API_KEY_P8" ]]; then
            echo "::error::inputs.sign is true but Apple signing secrets are missing." >&2
            exit 1
          fi
          key_path="$RUNNER_TEMP/apple_api_key.p8"
          printf '%s' "$APPLE_API_KEY_P8" | openssl base64 -d -A > "$key_path"
          echo "path=$key_path" >> "$GITHUB_OUTPUT"

      - name: Build the desktop installer
        working-directory: desktop
        env:
          VIDXP_DESKTOP_SIGN: ${{ (runner.os == 'macOS' && inputs.sign) && '1' || '' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ steps.apple_key.outputs.path }}
        run: npm run desktop:build

      - name: Verify signing and notarization
        if: runner.os == 'macOS' && inputs.sign
        working-directory: desktop
        shell: bash
        run: |
          dmg="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' | head -n1)"
          [[ -n "$dmg" ]]
          # Tauri removes the intermediate .app after packaging the DMG.
          codesign --verify --strict --verbose=2 "$dmg"
          mountpoint="$(mktemp -d "$RUNNER_TEMP/vidxp-dmg.XXXXXX")"
          trap 'hdiutil detach "$mountpoint" -quiet >/dev/null 2>&1 || true; rmdir "$mountpoint" >/dev/null 2>&1 || true' EXIT
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mountpoint"
          app="$(find "$mountpoint" -maxdepth 1 -name '*.app' | head -n1)"
          [[ -n "$app" ]]
          # The .app is signed (Developer ID), hardened-runtime, notarized + stapled.
          codesign --verify --strict --verbose=2 "$app"
          codesign -dvv "$app" 2>&1 | grep -i 'Authority=Developer ID Application'
          codesign -dvv "$app" 2>&1 | grep -iE 'flags=.*runtime'
          xcrun stapler validate "$app"
          spctl -a -t exec -vv "$app"

      - name: Verify the Windows app uses the GUI subsystem
        if: runner.os == 'Windows'
        run: powershell -ExecutionPolicy Bypass -File desktop/scripts/verify-windows-gui.ps1

      - name: Preserve the desktop installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target == 'windows' && 'vidxp-desktop-windows-x86_64' || matrix.target == 'macos' && 'vidxp-desktop-macos-aarch64' || 'vidxp-desktop-linux-x86_64' }}
          path: ${{ matrix.target == 'windows' && 'desktop/src-tauri/target/release/bundle/nsis/*-setup.exe' || matrix.target == 'macos' && 'desktop/src-tauri/target/release/bundle/dmg/*.dmg' || 'desktop/src-tauri/target/release/bundle/appimage/*.AppImage' }}
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ inputs.artifact_retention_days || 14 }}
