name: Desktop

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Commit to build
        required: true
        type: string
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: Commit, branch, or tag to build
        required: false
        default: ""
        type: string
  pull_request:
    paths:
      - "desktop/**"
      - "src/vidxp/requirements/**"
      - "src/vidxp/capabilities/*/requirements.txt"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/desktop.yml"
  push:
    branches:
      - main
    paths:
      - "desktop/**"
      - "src/vidxp/requirements/**"
      - "src/vidxp/capabilities/*/requirements.txt"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(github.event_name == 'pull_request' && '["windows"]' || '["windows","macos","linux"]') }}
        include:
          - target: windows
            label: Windows x86-64 NSIS
            runner: windows-2025
            sidecar_script: sidecar:windows
            bundle_glob: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            artifact: vidxp-desktop-windows-x86_64
          - target: macos
            label: macOS Apple Silicon DMG
            runner: macos-15
            sidecar_script: sidecar:unix
            bundle_glob: desktop/src-tauri/target/release/bundle/dmg/*.dmg
            artifact: vidxp-desktop-macos-aarch64
          - target: linux
            label: Linux x86-64 AppImage
            runner: ubuntu-24.04
            sidecar_script: sidecar:unix
            bundle_glob: desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            artifact: vidxp-desktop-linux-x86_64

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.event.inputs.checkout_ref || github.sha }}

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.0"
          enable-cache: false

      - uses: dtolnay/rust-toolchain@1.85.0

      - name: Install locked desktop tooling
        run: npm ci
        working-directory: desktop

      - name: Verify the desktop runtime constraints
        shell: bash
        run: |
          generated="$RUNNER_TEMP/runtime-constraints.txt"
          uv export \
            --frozen \
            --extra local-worker \
            --extra frontend \
            --no-dev \
            --no-emit-project \
            --no-hashes \
            --format requirements-txt \
            --output-file "$generated"
          git diff --no-index --ignore-matching-lines='^#' -- \
            desktop/runtime-constraints.txt "$generated"

      - name: Fetch the pinned uv sidecar
        run: npm run ${{ matrix.sidecar_script }}
        working-directory: desktop

      - name: Test the locked desktop crate
        run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml

      - name: Build the unsigned desktop installer
        run: npm run desktop:build
        working-directory: desktop

      - name: Verify the Windows app uses the GUI subsystem
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $path = "desktop/src-tauri/target/release/vidxp-desktop.exe"
          $stream = [System.IO.File]::OpenRead($path)
          try {
            $reader = [System.IO.BinaryReader]::new($stream)
            $stream.Position = 0x3c
            $peOffset = $reader.ReadInt32()
            $stream.Position = $peOffset + 4 + 20 + 68
            $subsystem = $reader.ReadUInt16()
            if ($subsystem -ne 2) {
              throw "Expected Windows GUI subsystem 2, found $subsystem."
            }
          } finally {
            $stream.Dispose()
          }

      - name: Preserve the desktop installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle_glob }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
