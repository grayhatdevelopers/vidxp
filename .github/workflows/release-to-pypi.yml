name: Release (tag → PyPI and GHCR)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable core tag to publish.
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pypi-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    with:
      checkout_ref: ${{ inputs.tag }}
      force_validation: true
      python_versions: '["3.11","3.12","3.13","3.14"]'
      provider_platforms: '["ubuntu-24.04","windows-2025","macos-15"]'
      run_containers: false

  build:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Resolve source revision
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Verify stable tag
        id: version
        shell: bash
        run: |
          tag="${{ inputs.tag }}"
          if [[ "$tag" != v* || "$tag" == *-* ]]; then
            echo "::error::$tag is not a stable core release tag."
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "::error::$tag is not an existing Git tag."
            exit 1
          fi
          version="${tag#v}"
          package_version="$(
            python -c \
              'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])'
          )"
          if [[ "$package_version" != "$version" ]]; then
            echo "::error::Tag $tag does not match package version $package_version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install build tooling
        run: python -m pip install -r utils/build-requirements.txt

      - name: Build distribution
        run: bash utils/build_package.sh

      - name: Smoke distribution
        shell: bash
        run: |
          python -m venv .release-smoke
          .release-smoke/bin/python -m pip install dist/*.whl
          .release-smoke/bin/python -m pip check
          .release-smoke/bin/vidxp --version

      - uses: actions/upload-artifact@v7
        with:
          name: pypi-${{ inputs.tag }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/download-artifact@v8
        with:
          name: pypi-${{ inputs.tag }}
          path: dist/

      - name: Check PyPI release state
        id: registry
        shell: bash
        run: |
          state="$(
            python utils/verify_published_distribution.py \
              --repository https://pypi.org \
              --package vidxp \
              --version "${{ needs.build.outputs.version }}" \
              --dist dist
          )"
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Publish to PyPI
        if: steps.registry.outputs.state == 'absent'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  publish-containers:
    needs:
      - build
      - publish-pypi
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/containers.yml
    with:
      channel: stable
      tag: ${{ inputs.tag }}
      version: ${{ needs.build.outputs.version }}

  publish-github:
    needs:
      - build
      - publish-pypi
      - publish-containers
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pypi-${{ inputs.tag }}
          path: dist/

      - name: Publish complete stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "${{ inputs.tag }}" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release edit "${{ inputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false

      - name: Synchronize stable source back to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run sync-channels.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f release_sha="${{ needs.build.outputs.source_sha }}"
