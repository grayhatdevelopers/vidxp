name: Prerelease (main → TestPyPI)

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "pyproject.toml"
      - "README.md"
      - "CHANGELOG.md"
      - "changes/**"
      - "LICENSE"
      - "MANIFEST.in"
      - "utils/**"
      - "desktop/**"
      - "uv.lock"
      - ".github/workflows/ci.yml"
      - ".github/workflows/desktop.yml"
      - ".github/workflows/release-to-test-pypi.yml"

permissions:
  contents: read

concurrency:
  group: testpypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml
    with:
      checkout_ref: ${{ github.sha }}
      force_validation: true
      provider_platforms: '["ubuntu-24.04","windows-2025","macos-15"]'
      run_containers: true

  prerelease:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit_sha: ${{ steps.release.outputs.commit_sha }}
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r utils/build-requirements.txt

      - name: Determine and tag prerelease version
        id: release
        env:
          BUILD_RELEASE_NOTES: "1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          semantic-release version
          --as-prerelease
          --prerelease-token b
          --no-changelog
          --no-vcs-release

      - name: Smoke distribution
        if: steps.release.outputs.released == 'true'
        shell: bash
        run: |
          python -m venv .release-smoke
          .release-smoke/bin/python -m pip install dist/*.whl
          .release-smoke/bin/python -m pip check
          .release-smoke/bin/vidxp --version

      - name: Preserve distribution
        if: steps.release.outputs.released == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: testpypi-distribution
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Preserve release notes
        if: steps.release.outputs.released == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: testpypi-release-notes
          path: .release-notes.md
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    if: needs.prerelease.outputs.released == 'true'
    needs:
      - prerelease
      - build-desktop
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: testpypi-distribution
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  build-desktop:
    if: needs.prerelease.outputs.released == 'true'
    needs: prerelease
    uses: ./.github/workflows/desktop.yml
    with:
      checkout_ref: ${{ needs.prerelease.outputs.commit_sha }}

  publish-github:
    if: needs.prerelease.outputs.released == 'true'
    needs:
      - prerelease
      - publish-testpypi
      - build-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prerelease.outputs.commit_sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r utils/build-requirements.txt

      - uses: actions/download-artifact@v8
        with:
          name: testpypi-distribution
          path: dist/

      - uses: actions/download-artifact@v8
        with:
          name: testpypi-release-notes
          path: .

      - uses: actions/download-artifact@v8
        with:
          pattern: vidxp-desktop-*
          path: desktop-dist/
          merge-multiple: true

      - name: Publish complete GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          semantic-release publish --tag "${{ needs.prerelease.outputs.tag }}"
          gh release edit "${{ needs.prerelease.outputs.tag }}" \
            --notes-file .release-notes.md
          gh release upload "${{ needs.prerelease.outputs.tag }}" \
            desktop-dist/* \
            --clobber
