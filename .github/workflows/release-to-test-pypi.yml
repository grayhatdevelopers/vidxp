name: Prerelease (tag → TestPyPI)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing core prerelease tag to publish.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: testpypi-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Verify prerelease tag
        id: version
        shell: bash
        run: |
          tag="${{ inputs.tag }}"
          if [[ "$tag" != v*-* ]]; then
            echo "::error::$tag is not a core prerelease tag."
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "::error::$tag is not an existing Git tag."
            exit 1
          fi
          version="${tag#v}"
          package_version="$(
            python -c \
              'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])'
          )"
          if [[ "$package_version" != "$version" ]]; then
            echo "::error::Tag $tag does not match package version $package_version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install build tooling
        run: python -m pip install -r utils/build-requirements.txt

      - name: Build distribution
        run: bash utils/build_package.sh

      - name: Smoke distribution
        shell: bash
        run: |
          python -m venv .release-smoke
          .release-smoke/bin/python -m pip install dist/*.whl
          .release-smoke/bin/python -m pip check
          .release-smoke/bin/vidxp --version

      - uses: actions/upload-artifact@v7
        with:
          name: testpypi-${{ inputs.tag }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/download-artifact@v8
        with:
          name: testpypi-${{ inputs.tag }}
          path: dist/

      - name: Check TestPyPI release state
        id: registry
        shell: bash
        run: |
          state="$(
            python utils/verify_published_distribution.py \
              --repository https://test.pypi.org \
              --package vidxp \
              --version "${{ needs.build.outputs.version }}" \
              --dist dist
          )"
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Publish to TestPyPI
        if: steps.registry.outputs.state == 'absent'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  publish-containers:
    needs:
      - build
      - publish
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/containers.yml
    with:
      channel: beta
      tag: ${{ inputs.tag }}
      version: ${{ needs.build.outputs.version }}

  publish-github:
    needs:
      - build
      - publish
      - publish-containers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: testpypi-${{ inputs.tag }}
          path: dist/

      - name: Publish complete prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "${{ inputs.tag }}" dist/* --clobber
          gh release edit "${{ inputs.tag }}" \
            --draft=false \
            --prerelease
