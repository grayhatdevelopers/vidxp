name: Prerelease (main → TestPyPI)

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "pyproject.toml"
      - "README.md"
      - "CHANGELOG.md"
      - "changes/**"
      - "LICENSE"
      - "MANIFEST.in"
      - "utils/**"
      - ".github/workflows/release-to-test-pypi.yml"

permissions:
  contents: read

concurrency:
  group: testpypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    with:
      checkout_ref: ${{ github.sha }}
      full: true

  prerelease:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r utils/build-requirements.txt

      - name: Determine and tag prerelease version
        id: release
        env:
          BUILD_RELEASE_NOTES: "1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release version --as-prerelease --prerelease-token b --no-changelog

      - name: Smoke distribution
        if: steps.release.outputs.released == 'true'
        shell: bash
        run: |
          python -m venv .release-smoke
          .release-smoke/bin/python -m pip install dist/*.whl
          .release-smoke/bin/python -m pip check
          .release-smoke/bin/vidxp --version

      - name: Publish GitHub release
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          semantic-release publish --tag "${{ steps.release.outputs.tag }}"
          gh release edit "${{ steps.release.outputs.tag }}" \
            --notes-file .release-notes.md

      - name: Preserve distribution
        if: steps.release.outputs.released == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: testpypi-distribution
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    if: needs.prerelease.outputs.released == 'true'
    needs: prerelease
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: testpypi-distribution
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
