name: Publish nightly package

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: Main revision to publish as an ephemeral nightly.
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: nightly-testpypi
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Assign an ephemeral nightly version
        id: version
        shell: bash
        run: |
          version="$(python utils/prepare_nightly.py --run-number "$GITHUB_RUN_NUMBER")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install build tooling
        run: python -m pip install -r utils/build-requirements.txt

      - name: Build and smoke the nightly distribution
        shell: bash
        run: |
          bash utils/build_package.sh
          python -m venv .nightly-smoke
          .nightly-smoke/bin/python -m pip install dist/*.whl
          .nightly-smoke/bin/python -m pip check
          [[ "$(.nightly-smoke/bin/vidxp --version)" == "VidXP ${{ steps.version.outputs.version }}" ]]

      - uses: actions/upload-artifact@v7
        with:
          name: vidxp-nightly-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: vidxp-nightly-dist
          path: dist/

      - name: Check TestPyPI release state
        id: registry
        shell: bash
        run: |
          state="$(
            python utils/verify_published_distribution.py \
              --repository https://test.pypi.org \
              --package vidxp \
              --version "${{ needs.build.outputs.version }}" \
              --dist dist
          )"
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Publish the unique nightly to TestPyPI
        if: steps.registry.outputs.state == 'absent'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

      - name: Download and install the exact TestPyPI artifact
        shell: bash
        run: |
          for _ in {1..30}; do
            state="$(
              python utils/verify_published_distribution.py \
                --repository https://test.pypi.org \
                --package vidxp \
                --version "${{ needs.build.outputs.version }}" \
                --dist dist
            )"
            [[ "$state" == "identical" ]] && break
            sleep 10
          done
          [[ "$state" == "identical" ]]

          python -m pip download \
            --index-url https://test.pypi.org/simple \
            --no-deps \
            --no-cache-dir \
            --dest downloaded \
            "vidxp==${{ needs.build.outputs.version }}"
          [[ "$(sha256sum dist/*.whl | cut -d' ' -f1)" == \
              "$(sha256sum downloaded/*.whl | cut -d' ' -f1)" ]]
          python -m venv .testpypi-smoke
          .testpypi-smoke/bin/python -m pip install downloaded/*.whl
          .testpypi-smoke/bin/python -m pip check
          [[ "$(.testpypi-smoke/bin/vidxp --version)" == \
              "VidXP ${{ needs.build.outputs.version }}" ]]
