name: Release containers

on:
  workflow_call:
    inputs:
      operation:
        description: Build a candidate or promote its immutable digests.
        required: true
        type: string
      checkout_ref:
        description: Exact source revision used for a candidate build.
        required: false
        default: ""
        type: string
      candidate_id:
        description: Stable candidate identifier used for temporary tags.
        required: true
        type: string
      channel:
        description: beta or stable when promoting.
        required: false
        default: ""
        type: string
      version:
        description: Combined release version without the v prefix.
        required: true
        type: string
      product_digest:
        required: false
        default: ""
        type: string
      control_digest:
        required: false
        default: ""
        type: string
      worker_digest:
        required: false
        default: ""
        type: string
    outputs:
      product_digest:
        value: ${{ jobs.stage.outputs.product_digest }}
      control_digest:
        value: ${{ jobs.stage.outputs.control_digest }}
      worker_digest:
        value: ${{ jobs.stage.outputs.worker_digest }}

permissions:
  contents: read
  packages: write

jobs:
  stage:
    if: inputs.operation == 'stage'
    runs-on: ubuntu-latest
    outputs:
      product_digest: ${{ steps.digests.outputs.product }}
      control_digest: ${{ steps.digests.outputs.control }}
      worker_digest: ${{ steps.digests.outputs.worker }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Verify staging inputs
        shell: bash
        run: |
          [[ "${{ inputs.checkout_ref }}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${{ inputs.candidate_id }}" =~ ^[0-9a-f]{40}$ ]]

      - name: Resolve source revision
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate Compose deployment configuration
        run: bash utils/validate_compose.sh

      - uses: docker/setup-buildx-action@v4

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=candidate-${{ inputs.candidate_id }}
          labels: |
            org.opencontainers.image.title=VidXP
            org.opencontainers.image.description=Local-first video indexing and search
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.licenses=MIT

      - name: Build product image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          push: false
          tags: ghcr.io/${{ github.repository }}:candidate-${{ inputs.candidate_id }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=release-product
          cache-to: type=gha,mode=max,scope=release-product

      - name: Build control image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          push: false
          target: control
          tags: ghcr.io/${{ github.repository }}:candidate-${{ inputs.candidate_id }}-control
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=release-control
          cache-to: type=gha,mode=max,scope=release-control

      - name: Build worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          push: false
          target: worker
          tags: ghcr.io/${{ github.repository }}:candidate-${{ inputs.candidate_id }}-worker
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=release-worker
          cache-to: type=gha,mode=max,scope=release-worker

      - name: Smoke candidate images
        shell: bash
        run: |
          product="ghcr.io/${{ github.repository }}:candidate-${{ inputs.candidate_id }}"
          control="${product}-control"
          worker="${product}-worker"
          bash utils/smoke_container.sh "$product" "$control" "$worker"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push candidate images and record immutable digests
        id: digests
        shell: bash
        run: |
          digest() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' |
              jq -er '.digest'
          }
          base="ghcr.io/${{ github.repository }}:candidate-${{ inputs.candidate_id }}"
          docker push "$base"
          docker push "${base}-control"
          docker push "${base}-worker"
          {
            echo "product=$(digest "$base")"
            echo "control=$(digest "${base}-control")"
            echo "worker=$(digest "${base}-worker")"
          } >> "$GITHUB_OUTPUT"

  promote:
    if: inputs.operation == 'promote'
    runs-on: ubuntu-latest
    steps:
      - name: Verify promotion inputs
        shell: bash
        run: |
          [[ "${{ inputs.channel }}" == "beta" || "${{ inputs.channel }}" == "stable" ]]
          [[ "${{ inputs.candidate_id }}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${{ inputs.product_digest }}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${{ inputs.control_digest }}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${{ inputs.worker_digest }}" =~ ^sha256:[0-9a-f]{64}$ ]]

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote the candidate manifests without rebuilding
        shell: bash
        run: |
          repository="ghcr.io/${{ github.repository }}"
          candidate="${repository}:candidate-${{ inputs.candidate_id }}"

          promote() {
            local source="$1"
            local expected="$2"
            shift 2
            actual="$(
              docker buildx imagetools inspect "$source" \
                --format '{{json .Manifest}}' | jq -er '.digest'
            )"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::$source resolved to $actual instead of $expected."
              exit 1
            fi
            for target in "$@"; do
              existing="$(
                docker buildx imagetools inspect "$target" \
                  --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest // empty' || true
              )"
              if [[ "$target" == "${repository}:${{ inputs.version }}"* &&
                    -n "$existing" && "$existing" != "$expected" ]]; then
                echo "::error::Immutable tag $target already points to $existing."
                exit 1
              fi
              [[ "$existing" == "$expected" ]] || \
                docker buildx imagetools create \
                  --prefer-index=false \
                  --tag "$target" \
                  "${repository}@${expected}"
            done
          }

          product_tags=("${repository}:${{ inputs.version }}")
          control_tags=("${repository}:${{ inputs.version }}-control")
          worker_tags=("${repository}:${{ inputs.version }}-worker")
          if [[ "${{ inputs.channel }}" == "stable" ]]; then
            major_minor="$(cut -d. -f1,2 <<< "${{ inputs.version }}")"
            product_tags+=("${repository}:${major_minor}" "${repository}:latest")
            control_tags+=("${repository}:latest-control")
            worker_tags+=("${repository}:latest-worker")
          else
            product_tags+=("${repository}:beta")
            control_tags+=("${repository}:beta-control")
            worker_tags+=("${repository}:beta-worker")
          fi

          promote "$candidate" "${{ inputs.product_digest }}" "${product_tags[@]}"
          promote "${candidate}-control" "${{ inputs.control_digest }}" "${control_tags[@]}"
          promote "${candidate}-worker" "${{ inputs.worker_digest }}" "${worker_tags[@]}"

      - name: Verify public release tags
        shell: bash
        run: |
          docker logout ghcr.io
          for suffix in "" "-control" "-worker"; do
            docker buildx imagetools inspect \
              "ghcr.io/${{ github.repository }}:${{ inputs.version }}${suffix}"
          done
