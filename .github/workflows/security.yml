name: Security

on:
  pull_request:
    branches:
      - main
      - release
    paths:
      - ".github/dependabot.yml"
      - ".github/workflows/**"
      - "pyproject.toml"
      - "uv.lock"
      - "src/**/*.txt"
      - "utils/build-requirements.txt"
      - "desktop/package.json"
      - "desktop/package-lock.json"
      - "desktop/runtime-constraints.txt"
      - "desktop/sidecars.json"
      - "desktop/src-tauri/Cargo.toml"
      - "desktop/src-tauri/Cargo.lock"

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    if: >-
      github.base_ref != 'release' ||
      github.head_ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          # No patched Chroma release exists yet. Chroma is kept on the
          # deployment's private network and is never published directly.
          allow-ghsas: GHSA-f4j7-r4q5-qw2c
